{% extends "gym/base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="entete-page"><h1>{{ titre }}</h1>{% if retour %}<a class="btn" href="{{ retour }}">← Retour</a>{% endif %}</div>
<div class="carte" style="max-width:860px">
  {% if aide %}<p class="muted petit">{{ aide }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    <div class="form-grille">{% include "gym/_champs.html" %}</div>
    <div class="mt"><button class="btn btn-primaire" type="submit">{{ bouton|default:"Enregistrer" }}</button>
      <a class="btn" href="javascript:history.back()">Annuler</a></div>
  </form>
</div>
{% endblock %}
